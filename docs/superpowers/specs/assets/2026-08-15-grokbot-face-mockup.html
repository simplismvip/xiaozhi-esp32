<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GrokBot-inspired · 21 emotions (circle + motion)</title>
  <style>
    :root {
      --bg: #12141a;
      --panel: #1c1f28;
      --face: #f4f1ea;
      --ink: #1a1a1e;
      --accent: #7dd3fc;
      --muted: #9ca3af;
      --pink: #fda4af;
      --heart: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #243047 0%, var(--bg) 55%);
      color: #e5e7eb;
      padding: 28px 16px 48px;
    }
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 6px; }
    p.sub { margin: 0 auto; color: var(--muted); font-size: 0.9rem; max-width: 40rem; }

    .stage-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 28px;
    }
    .stage {
      width: min(360px, 92vw);
      aspect-ratio: 1;
      max-width: 340px;
      background: var(--panel);
      border-radius: 24px;
      display: grid;
      place-items: center;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .stage-label { font-size: 0.95rem; color: #e2e8f0; }
    .stage-label code { color: #38bdf8; font-size: 0.85rem; }

    /* —— round face —— */
    .face {
      width: 200px;
      height: 200px;
      background: var(--face);
      border-radius: 50%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      overflow: visible;
      transform-origin: center center;
    }
    .eyes {
      display: flex; gap: 34px; align-items: center; height: 56px;
      position: relative; z-index: 2;
    }
    .eye {
      width: 48px; height: 48px; background: var(--ink); border-radius: 50%;
      position: relative; overflow: hidden;
      transform-origin: center center;
    }
    .eye::after {
      content: ""; position: absolute; width: 12px; height: 12px; background: #fff;
      border-radius: 50%; top: 10px; left: 10px;
    }
    .mouth {
      width: 36px; height: 10px; border: 3px solid var(--ink); border-top: none;
      border-radius: 0 0 20px 20px; background: transparent;
      position: relative; z-index: 2;
      transform-origin: center center;
    }
    .brow {
      position: absolute; top: 58px; width: 28px; height: 4px; background: var(--ink);
      border-radius: 4px; opacity: 0; z-index: 3;
    }
    .brow.l { left: 48px; }
    .brow.r { right: 48px; }
    .cheek {
      position: absolute; width: 16px; height: 10px; border-radius: 50%;
      background: var(--pink); opacity: 0; top: 118px; z-index: 1;
    }
    .cheek.l { left: 42px; }
    .cheek.r { right: 42px; }
    .prop {
      position: absolute; font-size: 18px; opacity: 0;
      pointer-events: none; z-index: 4;
    }
    .prop.hearts { right: 22px; top: 36px; color: var(--heart); }
    .prop.zzz { right: 28px; top: 28px; color: #64748b; font-size: 14px; letter-spacing: 2px; }
    .prop.sweat { right: 36px; top: 44px; color: var(--accent); font-size: 16px; }
    .prop.star { left: 28px; top: 40px; color: #fbbf24; }
    .prop.tear {
      width: 8px; height: 12px; border-radius: 50% 50% 50% 0; background: var(--accent);
      left: 62px; top: 112px; transform: rotate(45deg); font-size: 0;
    }
    .prop.glasses {
      top: 76px; left: 50%; transform: translateX(-50%);
      width: 122px; height: 32px;
      opacity: 0;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .prop.glasses::before,
    .prop.glasses::after {
      content: "";
      width: 48px; height: 28px;
      border: 3px solid var(--ink);
      border-radius: 8px;
      background: rgba(26, 26, 30, 0.35);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
    }
    .prop.glasses .bridge {
      position: absolute; left: 50%; top: 50%;
      width: 10px; height: 3px; background: var(--ink);
      transform: translate(-50%, -50%);
    }

    /* ========== base look + motion per emotion ========== */

    .e-neutral .mouth { width: 22px; height: 6px; }
    .e-neutral .eye { animation: blink 2.8s infinite; }
    .e-neutral { animation: breathe 3.2s ease-in-out infinite; }

    .e-happy .eye {
      height: 18px; border-radius: 0 0 24px 24px; transform: translateY(8px);
      animation: happyEye 1.2s ease-in-out infinite;
    }
    .e-happy .eye::after { display: none; }
    .e-happy .mouth {
      width: 44px; height: 22px; border: none; background: var(--ink);
      border-radius: 0 0 24px 24px;
      animation: mouthBounce 1.2s ease-in-out infinite;
    }
    .e-happy .cheek { opacity: .75; animation: cheekPulse 1.2s ease-in-out infinite; }
    .e-happy { animation: bounceSoft 1.2s ease-in-out infinite; }

    .e-laughing .eye {
      height: 14px; border-radius: 0 0 24px 24px; transform: translateY(10px);
      animation: happyEye 0.55s ease-in-out infinite;
    }
    .e-laughing .eye::after { display: none; }
    .e-laughing .mouth {
      width: 52px; height: 28px; border: none; background: var(--ink);
      border-radius: 0 0 28px 28px;
      animation: mouthBounce 0.55s ease-in-out infinite;
    }
    .e-laughing .cheek { opacity: .85; animation: cheekPulse 0.55s ease-in-out infinite; }
    .e-laughing { animation: bounceHard 0.55s ease-in-out infinite; }

    .e-funny .eye { animation: wiggleEye 0.55s ease-in-out infinite; }
    .e-funny .mouth {
      width: 40px; height: 18px; border: none; background: var(--ink);
      border-radius: 0 0 22px 22px;
      animation: tiltMouth 0.55s ease-in-out infinite;
    }
    .e-funny .cheek { opacity: .6; }
    .e-funny .prop.star { opacity: 1; animation: pop 0.9s ease-in-out infinite; }
    .e-funny { animation: wiggleFace 0.7s ease-in-out infinite; }

    .e-sad .eye { animation: sadDroop 2s ease-in-out infinite; }
    .e-sad .mouth {
      width: 28px; height: 12px; border: 3px solid var(--ink); border-bottom: none;
      border-radius: 16px 16px 0 0;
      animation: sadMouth 2s ease-in-out infinite;
    }
    .e-sad { animation: sink 2s ease-in-out infinite; }

    .e-angry .brow { opacity: 1; }
    .e-angry .brow.l { transform: rotate(18deg); animation: browL 0.35s ease-in-out infinite; }
    .e-angry .brow.r { transform: rotate(-18deg); animation: browR 0.35s ease-in-out infinite; }
    .e-angry .eye { height: 40px; animation: angryEye 0.35s ease-in-out infinite; }
    .e-angry .mouth {
      width: 32px; height: 4px; border: none; background: var(--ink); border-radius: 4px;
    }
    .e-angry { animation: shake 0.35s ease-in-out infinite; }

    .e-crying .eye { height: 36px; animation: cryPulse 1.1s ease-in-out infinite; }
    .e-crying .mouth {
      width: 30px; height: 14px; border: 3px solid var(--ink); border-bottom: none;
      border-radius: 18px 18px 0 0;
      animation: sobMouth 1.1s ease-in-out infinite;
    }
    .e-crying .prop.tear { opacity: 1; animation: drop 1.1s ease-in-out infinite; }
    .e-crying { animation: sob 1.1s ease-in-out infinite; }

    .e-loving .mouth {
      width: 40px; height: 18px; border: none; background: var(--ink);
      border-radius: 0 0 22px 22px;
      animation: mouthBounce 1.4s ease-in-out infinite;
    }
    .e-loving .cheek { opacity: .9; animation: cheekPulse 1.4s ease-in-out infinite; }
    .e-loving .prop.hearts { opacity: 1; animation: pop 1.2s ease-in-out infinite; }
    .e-loving .eye { animation: loveBlink 2.4s infinite; }
    .e-loving { animation: bounceSoft 1.4s ease-in-out infinite; }

    .e-embarrassed .eye { height: 42px; animation: embEye 1.5s ease-in-out infinite; }
    .e-embarrassed .mouth {
      width: 18px; height: 10px; border-radius: 50%; border: 3px solid var(--ink);
      animation: embMouth 1.5s ease-in-out infinite;
    }
    .e-embarrassed .cheek { opacity: 1; width: 18px; height: 12px; animation: cheekPulse 0.9s ease-in-out infinite; }
    .e-embarrassed .prop.sweat { opacity: 1; animation: sweatDrop 1.2s ease-in-out infinite; }
    .e-embarrassed { animation: fidget 1.5s ease-in-out infinite; }

    .e-surprised .eye { width: 54px; height: 54px; animation: popEye 1.3s ease-in-out infinite; }
    .e-surprised .mouth {
      width: 22px; height: 22px; border: 3px solid var(--ink); border-radius: 50%; background: #1a1a1e;
      animation: popMouth 1.3s ease-in-out infinite;
    }
    .e-surprised { animation: jumpTiny 1.3s ease-in-out infinite; }

    .e-shocked .eye { width: 56px; height: 56px; animation: shockEye 0.7s ease-in-out infinite; }
    .e-shocked .eye::after { width: 16px; height: 16px; }
    .e-shocked .mouth {
      width: 28px; height: 28px; border: none; border-radius: 50%; background: var(--ink);
      animation: popMouth 0.7s ease-in-out infinite;
    }
    .e-shocked .brow { opacity: 1; top: 48px; }
    .e-shocked .brow.l { transform: rotate(-12deg); }
    .e-shocked .brow.r { transform: rotate(12deg); }
    .e-shocked { animation: shake 0.45s ease-in-out infinite; }

    .e-thinking .eye.right { animation: thinkLook 2.2s ease-in-out infinite; }
    .e-thinking .eye.left { animation: thinkLookSlow 2.2s ease-in-out infinite; }
    .e-thinking .mouth {
      width: 16px; height: 8px; border-radius: 50%; border: 3px solid var(--ink);
    }
    .e-thinking .prop.zzz { opacity: 1; }
    .e-thinking .prop.zzz::before {
      content: "…"; font-size: 22px; color: #94a3b8;
      animation: dots 1.4s steps(3, end) infinite;
    }
    .e-thinking { animation: breathe 2.8s ease-in-out infinite; }

    .e-winking .eye.left { animation: wink 1.8s infinite; }
    .e-winking .eye.right { animation: winkOpen 1.8s infinite; }
    .e-winking .mouth {
      width: 34px; height: 14px; border: none; background: var(--ink);
      border-radius: 0 0 18px 18px;
      animation: mouthBounce 1.8s ease-in-out infinite;
    }
    .e-winking { animation: bounceSoft 1.8s ease-in-out infinite; }

    /* cool: half-lidded eyes + slight smirk, no bulky frames */
    .e-cool .prop.glasses { display: none; }
    .e-cool .eye {
      height: 28px;
      border-radius: 50% 50% 40% 40%;
      animation: coolSquint 2.2s ease-in-out infinite;
    }
    .e-cool .eye::after {
      top: 6px; left: 14px; width: 10px; height: 10px;
    }
    .e-cool .brow { opacity: 1; top: 62px; height: 3px; width: 26px; }
    .e-cool .brow.l { transform: rotate(-6deg); }
    .e-cool .brow.r { transform: rotate(6deg); }
    .e-cool .mouth {
      width: 26px; height: 10px;
      border: 3px solid var(--ink); border-top: none; border-left: none;
      border-radius: 0 0 14px 0;
      background: transparent;
      transform-origin: left center;
      animation: coolSmirk 2.2s ease-in-out infinite;
    }
    .e-cool { animation: coolPose 2.2s ease-in-out infinite; }

    .e-relaxed .eye {
      height: 22px; border-radius: 0 0 26px 26px;
      animation: relaxEye 3s ease-in-out infinite;
    }
    .e-relaxed .eye::after { display: none; }
    .e-relaxed .mouth { width: 30px; height: 10px; border-radius: 0 0 16px 16px; }
    .e-relaxed { animation: breathe 3.4s ease-in-out infinite; }

    .e-delicious .eye {
      height: 16px; border-radius: 0 0 22px 22px;
      animation: yumEye 0.9s ease-in-out infinite;
    }
    .e-delicious .eye::after { display: none; }
    .e-delicious .mouth {
      width: 36px; height: 20px; border: none; background: var(--ink);
      border-radius: 8px 8px 20px 20px;
      animation: chew 0.9s ease-in-out infinite;
    }
    .e-delicious .cheek { opacity: .7; }
    .e-delicious .prop.star { opacity: 1; left: auto; right: 28px; }
    .e-delicious .prop.star::before {
      content: "♪"; color: #fbbf24; font-size: 20px;
      animation: pop 0.9s ease-in-out infinite;
    }
    .e-delicious { animation: bounceSoft 0.9s ease-in-out infinite; }

    .e-kissy .eye {
      height: 20px; border-radius: 0 0 24px 24px;
      animation: happyEye 1.1s ease-in-out infinite;
    }
    .e-kissy .eye::after { display: none; }
    .e-kissy .mouth {
      width: 16px; height: 14px; border: 3px solid var(--ink); border-radius: 50%;
      background: var(--heart);
      animation: kiss 1.1s ease-in-out infinite;
    }
    .e-kissy .prop.hearts { opacity: 1; animation: pop 1.1s ease-in-out infinite; }
    .e-kissy { animation: bounceSoft 1.1s ease-in-out infinite; }

    .e-confident .eye { height: 44px; animation: confBlink 2.6s infinite; }
    .e-confident .brow { opacity: 1; top: 56px; height: 3px; }
    .e-confident .brow.l { transform: rotate(-8deg); }
    .e-confident .brow.r { transform: rotate(8deg); }
    .e-confident .mouth {
      width: 38px; height: 12px; border: none; background: var(--ink);
      border-radius: 0 0 18px 18px;
    }
    .e-confident { animation: nod 2.2s ease-in-out infinite; }

    .e-sleepy .eye { height: 4px; border-radius: 4px; animation: sleepLine 2.4s ease-in-out infinite; }
    .e-sleepy .eye::after { display: none; }
    .e-sleepy .mouth { width: 28px; height: 8px; }
    .e-sleepy .prop.zzz { opacity: 1; animation: zzz 1.6s ease-in-out infinite; }
    .e-sleepy .prop.zzz::before { content: "z z"; }
    .e-sleepy { animation: breathe 2.8s ease-in-out infinite; }

    .e-silly .eye.left { animation: sillyL 0.7s ease-in-out infinite; }
    .e-silly .eye.right { animation: sillyR 0.7s ease-in-out infinite; }
    .e-silly .mouth {
      width: 42px; height: 16px; border: none; background: var(--ink);
      border-radius: 8px 16px 8px 20px;
      animation: sillyMouth 0.7s ease-in-out infinite;
    }
    .e-silly .prop.star { opacity: 1; animation: pop 0.8s ease-in-out infinite; }
    .e-silly { animation: wiggleFace 0.7s ease-in-out infinite; }

    .e-confused .brow { opacity: 1; }
    .e-confused .brow.l { transform: rotate(-16deg); animation: confBrowL 1.4s ease-in-out infinite; }
    .e-confused .brow.r { transform: rotate(6deg) translateY(4px); animation: confBrowR 1.4s ease-in-out infinite; }
    .e-confused .eye { animation: confEye 1.4s ease-in-out infinite; }
    .e-confused .mouth {
      width: 20px; height: 20px; border: 3px solid var(--ink);
      border-radius: 50% 50% 40% 60%;
      animation: confMouth 1.4s ease-in-out infinite;
    }
    .e-confused .prop.sweat { opacity: 1; }
    .e-confused .prop.sweat::before {
      content: "?"; color: #94a3b8; font-size: 20px; font-weight: 700;
      animation: pop 1.4s ease-in-out infinite;
    }
    .e-confused { animation: tiltThink 1.4s ease-in-out infinite; }

    /* —— keyframes —— */
    @keyframes blink {
      0%, 42%, 48%, 100% { height: 48px; border-radius: 50%; }
      45% { height: 4px; border-radius: 4px; }
    }
    @keyframes loveBlink {
      0%, 70%, 78%, 100% { height: 48px; border-radius: 50%; }
      74% { height: 6px; border-radius: 4px; }
    }
    @keyframes confBlink {
      0%, 80%, 88%, 100% { height: 44px; border-radius: 50%; }
      84% { height: 5px; border-radius: 4px; }
    }
    @keyframes coolSquint {
      0%, 100% { height: 28px; transform: translateY(2px); }
      50% { height: 24px; transform: translateY(3px); }
    }
    @keyframes coolSmirk {
      0%, 100% { transform: scaleX(1) rotate(0deg); }
      50% { transform: scaleX(1.08) rotate(2deg); }
    }
    @keyframes coolPose {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      50% { transform: rotate(-3deg) translateY(-3px); }
    }
    @keyframes wink {
      0%, 55%, 100% { height: 48px; border-radius: 50%; }
      60%, 78% { height: 5px; border-radius: 4px; }
      82% { height: 48px; border-radius: 50%; }
    }
    @keyframes winkOpen {
      0%, 100% { height: 48px; }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    @keyframes bounceSoft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes bounceHard {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    @keyframes mouthBounce {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.12); }
    }
    @keyframes cheekPulse {
      0%, 100% { opacity: .55; transform: scale(1); }
      50% { opacity: .95; transform: scale(1.15); }
    }
    @keyframes happyEye {
      0%, 100% { transform: translateY(8px) scaleY(1); }
      50% { transform: translateY(6px) scaleY(1.15); }
    }
    @keyframes yumEye {
      0%, 100% { transform: translateY(8px); }
      50% { transform: translateY(5px); }
    }
    @keyframes relaxEye {
      0%, 100% { height: 22px; transform: translateY(6px); }
      50% { height: 16px; transform: translateY(8px); }
    }
    @keyframes chew {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.72); }
    }
    @keyframes kiss {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }
    @keyframes wiggleEye {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes wiggleFace {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes tiltMouth {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(4deg); }
    }
    @keyframes pop {
      0%, 100% { transform: scale(1) translateY(0); opacity: .65; }
      50% { transform: scale(1.2) translateY(-4px); opacity: 1; }
    }
    @keyframes drop {
      0%, 100% { opacity: .4; transform: rotate(45deg) translateY(0); }
      50% { opacity: 1; transform: rotate(45deg) translateY(8px); }
    }
    @keyframes zzz {
      0%, 100% { opacity: .35; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-5px); }
    }
    @keyframes sleepLine {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(1.15); }
    }
    @keyframes sadDroop {
      0%, 100% { transform: translateY(2px); }
      50% { transform: translateY(6px); }
    }
    @keyframes sadMouth {
      0%, 100% { transform: translateY(2px) scaleX(1); }
      50% { transform: translateY(5px) scaleX(1.08); }
    }
    @keyframes sink {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }
    @keyframes browL {
      0%, 100% { transform: rotate(18deg) translateY(0); }
      50% { transform: rotate(22deg) translateY(1px); }
    }
    @keyframes browR {
      0%, 100% { transform: rotate(-18deg) translateY(0); }
      50% { transform: rotate(-22deg) translateY(1px); }
    }
    @keyframes angryEye {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes cryPulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }
    @keyframes sobMouth {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.2); }
    }
    @keyframes sob {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(3px) rotate(-1deg); }
    }
    @keyframes embEye {
      0%, 100% { transform: translateY(2px) scale(1); }
      50% { transform: translateY(5px) scale(0.96); }
    }
    @keyframes embMouth {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.9); }
    }
    @keyframes fidget {
      0%, 100% { transform: rotate(0) translateX(0); }
      33% { transform: rotate(-2deg) translateX(-2px); }
      66% { transform: rotate(2deg) translateX(2px); }
    }
    @keyframes sweatDrop {
      0%, 100% { transform: translateY(0); opacity: .7; }
      50% { transform: translateY(5px); opacity: 1; }
    }
    @keyframes popEye {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes shockEye {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.14); }
    }
    @keyframes popMouth {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    @keyframes jumpTiny {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(-8px); }
    }
    @keyframes thinkLook {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(5px, -7px); }
    }
    @keyframes thinkLookSlow {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(3px, -3px); }
    }
    @keyframes dots {
      0% { opacity: .2; }
      100% { opacity: 1; }
    }
    @keyframes coolSlide {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(1px); }
    }
    @keyframes nod {
      0%, 100% { transform: rotate(0); }
      40% { transform: rotate(3deg); }
      70% { transform: rotate(-2deg); }
    }
    @keyframes sillyL {
      0%, 100% { transform: rotate(-12deg) translateY(-2px); }
      50% { transform: rotate(-18deg) translateY(2px); }
    }
    @keyframes sillyR {
      0%, 100% { transform: rotate(12deg) translateY(4px) scaleY(0.85); }
      50% { transform: rotate(18deg) translateY(0) scaleY(1); }
    }
    @keyframes sillyMouth {
      0%, 100% { transform: rotate(6deg) scaleX(1); }
      50% { transform: rotate(-4deg) scaleX(1.08); }
    }
    @keyframes confBrowL {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(-22deg) translateY(-2px); }
    }
    @keyframes confBrowR {
      0%, 100% { transform: rotate(6deg) translateY(4px); }
      50% { transform: rotate(12deg) translateY(2px); }
    }
    @keyframes confEye {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(2px); }
    }
    @keyframes confMouth {
      0%, 100% { transform: rotate(-20deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes tiltThink {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(4deg); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 12px;
      max-width: 980px;
      margin: 0 auto;
    }
    .card {
      background: var(--panel);
      border-radius: 16px;
      padding: 12px 8px 10px;
      cursor: pointer;
      border: 1px solid transparent;
      text-align: center;
      overflow: hidden;
    }
    .card:hover, .card.active { border-color: #38bdf8; }
    .card .mini {
      width: 120px; height: 120px; margin: 0 auto 8px;
      display: grid; place-items: center;
      pointer-events: none;
    }
    .card .mini .face {
      width: 200px; height: 200px;
      transform: scale(0.55);
      transform-origin: center center;
    }
    .card .name { font-size: 0.8rem; color: #cbd5e1; }
    .card .en { font-size: 0.7rem; color: #64748b; font-family: ui-monospace, monospace; }
    .note { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>GrokBot 风格 · 圆形脸 + 全表情动画</h1>
    <p class="sub">脸改为正圆。21 个表情均有循环动作（眨眼/弹跳/抖动/泪滴等）。点卡片切换大图；小卡也会动。</p>
  </header>

  <div class="stage-wrap">
    <div class="stage">
      <div class="face e-neutral" id="face">
        <div class="brow l"></div>
        <div class="brow r"></div>
        <div class="eyes">
          <div class="eye left"></div>
          <div class="eye right"></div>
        </div>
        <div class="mouth"></div>
        <div class="cheek l"></div>
        <div class="cheek r"></div>
        <div class="prop hearts">♥ ♥</div>
        <div class="prop zzz"></div>
        <div class="prop sweat"></div>
        <div class="prop star">★</div>
        <div class="prop tear"></div>
        <div class="prop glasses"></div>
      </div>
    </div>
    <div class="stage-label" id="label">中性 · <code>neutral</code></div>
  </div>

  <div class="grid" id="grid"></div>
  <p class="note">刷新页面即可看到更新。仍是预览稿，未改固件。</p>

  <script>
    const EMOS = [
      ["neutral", "中性"],
      ["happy", "开心"],
      ["laughing", "大笑"],
      ["funny", "搞怪"],
      ["sad", "伤心"],
      ["angry", "生气"],
      ["crying", "大哭"],
      ["loving", "喜爱"],
      ["embarrassed", "尴尬"],
      ["surprised", "惊讶"],
      ["shocked", "震惊"],
      ["thinking", "思考"],
      ["winking", "眨眼"],
      ["cool", "酷"],
      ["relaxed", "放松"],
      ["delicious", "好吃"],
      ["kissy", "亲亲"],
      ["confident", "自信"],
      ["sleepy", "困倦"],
      ["silly", "傻笑"],
      ["confused", "困惑"],
    ];

    const face = document.getElementById("face");
    const label = document.getElementById("label");
    const grid = document.getElementById("grid");

    function faceHTML(extraClass) {
      return `<div class="face ${extraClass}">
        <div class="brow l"></div><div class="brow r"></div>
        <div class="eyes"><div class="eye left"></div><div class="eye right"></div></div>
        <div class="mouth"></div>
        <div class="cheek l"></div><div class="cheek r"></div>
        <div class="prop hearts">♥ ♥</div>
        <div class="prop zzz"></div>
        <div class="prop sweat"></div>
        <div class="prop star">★</div>
        <div class="prop tear"></div>
        <div class="prop glasses"></div>
      </div>`;
    }

    function setEmo(key, zh) {
      face.className = "face e-" + key;
      label.innerHTML = `${zh} · <code>${key}</code>`;
      grid.querySelectorAll(".card").forEach(c => {
        c.classList.toggle("active", c.dataset.key === key);
      });
    }

    EMOS.forEach(([key, zh], i) => {
      const card = document.createElement("div");
      card.className = "card" + (i === 0 ? " active" : "");
      card.dataset.key = key;
      card.innerHTML = `<div class="mini">${faceHTML("e-" + key)}</div>
        <div class="name">${zh}</div><div class="en">${key}</div>`;
      card.addEventListener("click", () => setEmo(key, zh));
      grid.appendChild(card);
    });
  </script>
</body>
</html>
